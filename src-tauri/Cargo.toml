[package]
name = "smart-files-ai"
version = "0.1.0"
description = "Smart Files AI: File intelligence with integrated AI backend"
authors = ["Prawin Kumar S <prawinkumar1506@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5"
opener = "0.7"
sysinfo = "0.30"
